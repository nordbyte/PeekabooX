[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "peekaboox"
version = "1.0.1"
description = "Linux-native AI computer-use agent runtime for PeekabooX"
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "grpcio>=1.80",
    "protobuf>=6.31",
]

[project.urls]
Homepage = "https://github.com/nordbyte/PeekabooX"
Repository = "https://github.com/nordbyte/PeekabooX"
Issues = "https://github.com/nordbyte/PeekabooX/issues"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.80",
]

[project.scripts]
peekaboox-agent = "peekaboox.agent.runtime:main"
peekaboox-mcp = "peekaboox.mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
