name: input-actions-live
steps:
  - action: move_mouse
    x: 100
    y: 100
    verify: false
  - action: drag
    from_x: 100
    from_y: 100
    to_x: 220
    to_y: 140
    button: left
    duration_ms: 250
    verify: false
  - action: type_text
    value: PeekabooX workflow typing
    typing_speed_chars_per_second: 20
    backend: auto
    dry_run: true
    verify: false
  - action: paste_text
    value: PeekabooX workflow paste
    preserve_clipboard: true
    verify: false
  - action: hotkey
    value: ctrl+s
    verify: false
