schema_version: peekaboox.workflow.v1
name: input-actions-live
steps:
  - action: move_mouse
    x: 100
    y: 100
    verify: false
  - action: drag
    from_x: 100
    from_y: 100
    to_x: 220
    to_y: 140
    button: left
    duration_ms: 250
    verify: false
  - action: type_text
    value: PeekabooX workflow typing
    typing_speed_chars_per_second: 20
    backend: auto
    dry_run: true
    verify: false
  - action: paste_text
    value: PeekabooX workflow paste
    preserve_clipboard: true
    dry_run: true
    clipboard_backend: auto
    hotkey_backend: auto
    delay_ms: 80
    restore_delay_ms: 120
    restore_policy: best-effort
    verify: false
  - action: hotkey
    value: control+s
    dry_run: true
    backend: auto
    delay_ms: 25
    key_delay_ms: 30
    repeat: 2
    interval_ms: 40
    release_before: true
    release_after: true
    verify: false
