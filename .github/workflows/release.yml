name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example 0.1.0
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Resolve release version
        run: |
          VERSION="${RELEASE_REF#v}"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python -m pip install -e "python[dev]"
      - run: python -m compileall python/src
      - run: PYTHONPATH=python/src python -m unittest discover -s python/tests -p "test_*.py"
      - run: PYTHONPATH=python/src python examples/python/runtime_smoke.py
      - run: PYTHONPATH=python/src bash examples/mcp/jsonrpc_list_tools.sh
      - run: python packaging/release_manifest.py --check --expected-version "$RELEASE_VERSION"
      - run: python -m pip wheel --no-deps -w target/python-wheel ./python
      - run: cargo build --release -p peekaboox-cli -p peekabooxd
      - run: PEEKABOOX_BIN=target/release/peekaboox bash examples/cli/vision-smoke.sh
      - run: PEEKABOOX_BIN=target/release/peekaboox bash examples/cli/vision_elements_fixture.sh
      - run: python packaging/debian/build_deb.py --skip-cargo-build
      - run: python packaging/smoke_install.py --skip-cargo-install
      - run: docker build --target smoke -t "peekaboox:${RELEASE_VERSION}" .
      - name: Write Docker image metadata
        run: |
          mkdir -p target/dist
          docker image inspect --format '{{json .}}' "peekaboox:${RELEASE_VERSION}" > target/dist/docker-image.json
      - run: python packaging/release_manifest.py --expected-version "$RELEASE_VERSION"
      - name: Write release notes
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header_prefix = f"## {version} - "
          lines = []
          capture = False
          for line in changelog:
              if line.startswith(header_prefix):
                  capture = True
                  lines.append(line)
                  continue
              if capture and line.startswith("## "):
                  break
              if capture:
                  lines.append(line)
          if not lines:
              raise SystemExit(f"missing changelog entry for {version}")
          Path("target/dist/release-notes.md").write_text(
              "\n".join(lines).strip() + "\n\n"
              "See release-manifest.json for the complete artifact manifest.\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: peekaboox-${{ env.RELEASE_VERSION }}-release-artifacts
          path: |
            target/python-wheel/*.whl
            target/dist/*.deb
            target/dist/docker-image.json
            target/dist/release-manifest.json
            target/dist/SHA256SUMS
            target/dist/release-notes.md
      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/python-wheel/*.whl \
            target/dist/*.deb \
            target/dist/docker-image.json \
            target/dist/release-manifest.json \
            target/dist/SHA256SUMS \
            --title "PeekabooX ${RELEASE_VERSION}" \
            --notes-file target/dist/release-notes.md \
            --verify-tag
