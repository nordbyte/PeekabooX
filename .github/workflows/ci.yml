name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e "python[dev]"
      - run: python -m ruff check python/src python/tests benchmarks examples/python packaging tests
      - run: python -m compileall python/src
      - run: PYTHONPATH=python/src python -m pytest python/tests -q
      - run: PYTHONPATH=python/src python tests/api_surface_check.py
      - run: PYTHONPATH=python/src python examples/python/runtime_smoke.py
      - run: PYTHONPATH=python/src bash examples/mcp/jsonrpc_list_tools.sh
      - name: Validate live desktop example syntax
        run: bash examples/desktop/run_all.sh --syntax-only
      - run: python -m pip wheel --no-deps -w target/python-wheel ./python
      - run: python packaging/smoke_install.py --skip-deb --skip-cargo-install --wheel "target/python-wheel/peekaboox-*.whl"
      - uses: actions/upload-artifact@v5
        with:
          name: python-wheel
          path: target/python-wheel/*.whl

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config tesseract-ocr
      - run: bash -n packaging/install-rust.sh
      - run: python packaging/release_manifest.py --check
      - run: python packaging/debian/build_deb.py --check
      - run: python -m pip wheel --no-deps -w target/python-wheel ./python
      - run: cargo build --release -p peekaboox-cli -p peekabooxd
      - run: PEEKABOOX_BIN=target/release/peekaboox bash examples/cli/vision-smoke.sh
      - run: PEEKABOOX_BIN=target/release/peekaboox bash examples/cli/vision_elements_fixture.sh
      - run: PEEKABOOX_BIN=target/release/peekaboox bash examples/cli/compare_visual_regression.sh
      - run: PEEKABOOX_BIN=target/release/peekaboox bash examples/cli/ui_state_sequence.sh
      - run: PEEKABOOX_BIN=target/release/peekaboox bash examples/cli/ocr-smoke.sh
      - run: python packaging/debian/build_deb.py --skip-cargo-build
      - run: python packaging/smoke_install.py --skip-wheel --skip-cargo-install --deb "target/dist/peekaboox_*.deb"
      - run: python packaging/smoke_install.py --skip-wheel --skip-deb --cargo-root target/install-smoke/cargo
      - run: docker build --target smoke -t peekaboox:ci .
      - name: Write Docker image metadata
        run: |
          mkdir -p target/dist
          docker image inspect --format '{{json .}}' peekaboox:ci > target/dist/docker-image.json
      - run: python packaging/release_manifest.py --output target/dist/ci-release-manifest.json
      - uses: actions/upload-artifact@v5
        with:
          name: package-artifacts
          path: |
            target/python-wheel/*.whl
            target/dist/*.deb
            target/dist/docker-image.json
            target/dist/ci-release-manifest.json
            target/dist/SHA256SUMS

  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: PYTHONPATH=python/src python benchmarks/perf_baseline.py --iterations 30 --json-out target/benchmark-results.json
      - uses: actions/upload-artifact@v5
        with:
          name: benchmark-results
          path: target/benchmark-results.json
