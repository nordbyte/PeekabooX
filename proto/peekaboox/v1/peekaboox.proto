syntax = "proto3";

package peekaboox.v1;

service PeekabooX {
  rpc CaptureScreen(CaptureScreenRequest) returns (CaptureScreenResponse);
  rpc CaptureDelta(CaptureDeltaRequest) returns (CaptureDeltaResponse);
  rpc CaptureBackends(CaptureBackendsRequest) returns (CaptureBackendsResponse);
  rpc MoveMouse(MoveMouseRequest) returns (ActionResponse);
  rpc Click(ClickRequest) returns (ActionResponse);
  rpc Drag(DragRequest) returns (ActionResponse);
  rpc TypeText(TypeTextRequest) returns (ActionResponse);
  rpc PasteText(PasteTextRequest) returns (ActionResponse);
  rpc Hotkey(HotkeyRequest) returns (ActionResponse);
  rpc FindElement(FindElementRequest) returns (FindElementResponse);
  rpc ListWindows(ListWindowsRequest) returns (ListWindowsResponse);
  rpc GetDesktopState(GetDesktopStateRequest) returns (DesktopState);
  rpc OcrScreen(OcrScreenRequest) returns (OcrResponse);
  rpc CompareImages(CompareImagesRequest) returns (VisualDiffResponse);
  rpc DetectUiState(DetectUiStateRequest) returns (UiStateResponse);
  rpc DetectUiElements(DetectUiElementsRequest) returns (DetectUiElementsResponse);
  rpc ProbeDmaBuf(ProbeDmaBufRequest) returns (DmaBufProbeResponse);
  rpc ListPlugins(ListPluginsRequest) returns (PluginListResponse);
  rpc CallPluginTool(CallPluginToolRequest) returns (PluginToolExecutionResponse);
  rpc DesktopFocus(DesktopFocusRequest) returns (DesktopActionResponse);
  rpc DesktopLocate(DesktopLocateRequest) returns (DesktopLocateResponse);
  rpc DesktopClick(DesktopClickRequest) returns (DesktopActionResponse);
  rpc DesktopDrag(DesktopDragRequest) returns (DesktopActionResponse);
  rpc DesktopTypeInto(DesktopTypeIntoRequest) returns (DesktopActionResponse);
  rpc DesktopAssert(DesktopAssertRequest) returns (DesktopActionResponse);
}

message CaptureScreenRequest {
  CaptureTarget target = 1;
  bool include_semantic_tree = 2;
}

message CaptureScreenResponse {
  bytes image = 1;
  string mime_type = 2;
  repeated UiElement semantic_tree = 3;
  CaptureMetadata metadata = 4;
}

message CaptureDeltaRequest {
  string stream_id = 1;
  bool reset = 2;
  CaptureTarget target = 3;
  optional Rect region = 4;
  optional uint32 per_channel_threshold = 5;
  optional bool low_bandwidth = 6;
}

message CaptureDeltaResponse {
  string stream_id = 1;
  uint64 sequence = 2;
  bool full_frame = 3;
  uint32 frame_width = 4;
  uint32 frame_height = 5;
  PixelFormat pixel_format = 6;
  optional Rect changed_bounds = 7;
  uint64 changed_pixels = 8;
  float changed_ratio = 9;
  uint32 patch_stride = 10;
  bytes patch = 11;
  CaptureMetadata metadata = 12;
  optional Rect capture_region = 13;
  bool low_bandwidth = 14;
}

message CaptureTarget {
  oneof target {
    bool full_screen = 1;
    Rect region = 2;
    string window_id = 3;
  }
}

message CaptureMetadata {
  uint32 width = 1;
  uint32 height = 2;
  string backend = 3;
  uint64 captured_at_unix_ms = 4;
}

enum PixelFormat {
  PIXEL_FORMAT_UNSPECIFIED = 0;
  PIXEL_FORMAT_RGB8 = 1;
  PIXEL_FORMAT_RGBA8 = 2;
  PIXEL_FORMAT_BGRA8 = 3;
}

enum CaptureBackendProbe {
  CAPTURE_BACKEND_PROBE_UNSPECIFIED = 0;
  CAPTURE_BACKEND_PROBE_NONE = 1;
  CAPTURE_BACKEND_PROBE_FILE = 2;
  CAPTURE_BACKEND_PROBE_FRAME = 3;
  CAPTURE_BACKEND_PROBE_REGION = 4;
  CAPTURE_BACKEND_PROBE_DMA_BUF = 5;
  CAPTURE_BACKEND_PROBE_ALL = 6;
}

message CaptureBackendsRequest {
  string output = 1;
  optional Rect region = 2;
  bool diagnose = 3;
  CaptureBackendProbe probe = 4;
}

message CaptureBackendsResponse {
  string session_type = 1;
  optional string desktop = 2;
  bool pipewire_session_available = 3;
  bool pipewire_backend_feature_enabled = 4;
  bool egl_backend_feature_enabled = 5;
  string output_path = 6;
  optional Rect region = 7;
  repeated CaptureBackend image_backends = 8;
  repeated ZeroCopyBackend zero_copy_backends = 9;
  repeated CaptureBackendProbeResult probes = 10;
  repeated string warnings = 11;
}

message CaptureBackend {
  string name = 1;
  string backend_kind = 2;
  optional string command = 3;
  bool available = 4;
  bool supports_output = 5;
  bool supports_file_capture = 6;
  bool supports_stdout_capture = 7;
  bool supports_stdout_region_capture = 8;
  bool selected = 9;
  optional string reason = 10;
}

message ZeroCopyBackend {
  string name = 1;
  string backend_kind = 2;
  string transport = 3;
  string availability = 4;
  bool selected = 5;
  bool pipewire_backend_feature_enabled = 6;
  bool egl_backend_feature_enabled = 7;
  optional string reason = 8;
}

message CaptureBackendProbeResult {
  string probe = 1;
  bool ok = 2;
  optional string backend_name = 3;
  optional string backend_kind = 4;
  string detail = 5;
  optional string output_path = 6;
  optional uint64 bytes_written = 7;
  optional uint32 width = 8;
  optional uint32 height = 9;
}

message ClickRequest {
  optional Point coordinates = 1;
  optional string semantic_selector = 2;
  optional string window_selector = 3;
  bool vision_fallback = 4;
}

message MoveMouseRequest {
  Point coordinates = 1;
}

message DragRequest {
  Point from = 1;
  Point to = 2;
  optional MouseButton button = 3;
  optional uint32 duration_ms = 4;
}

message TypeTextRequest {
  string text = 1;
  optional uint32 typing_speed_chars_per_second = 2;
}

message PasteTextRequest {
  string text = 1;
  bool preserve_clipboard = 2;
}

message HotkeyRequest {
  repeated string keys = 1;
}

enum MouseButton {
  MOUSE_BUTTON_UNSPECIFIED = 0;
  MOUSE_BUTTON_LEFT = 1;
  MOUSE_BUTTON_MIDDLE = 2;
  MOUSE_BUTTON_RIGHT = 3;
}

message FindElementRequest {
  string selector = 1;
  bool vision_fallback = 2;
  optional string app = 3;
  optional string window_title = 4;
  optional string window_id = 5;
  optional Rect vision_region = 6;
  optional uint32 vision_edge_threshold = 7;
  optional uint32 vision_min_width = 8;
  optional uint32 vision_min_height = 9;
  optional uint32 vision_min_component_pixels = 10;
  optional uint32 vision_max_elements = 11;
  optional uint32 vision_merge_distance = 12;
}

message FindElementResponse {
  repeated UiElement elements = 1;
  string backend_name = 2;
  string backend_kind = 3;
  repeated string warnings = 4;
  bool cache_hit = 5;
  uint64 cache_age_ms = 6;
  bool vision_fallback_used = 7;
}

message ListWindowsRequest {
  optional string id = 1;
  optional string app = 2;
  optional string title = 3;
  optional string title_regex = 4;
  bool focused = 5;
  optional uint32 limit = 6;
  optional string sort = 7;
  optional string backend = 8;
  bool diagnose = 9;
}

message ListWindowsResponse {
  repeated WindowInfo windows = 1;
  string backend_name = 2;
  string backend_kind = 3;
  repeated string warnings = 4;
  repeated WindowBackendReport backend_reports = 5;
}

message WindowBackendReport {
  string backend_name = 1;
  string backend_kind = 2;
  uint32 raw_window_count = 3;
  uint32 matched_window_count = 4;
  bool selected = 5;
  optional string error = 6;
}

message GetDesktopStateRequest {}

message DesktopState {
  optional WindowInfo active_window = 1;
  repeated WindowInfo windows = 2;
  repeated UiElement elements = 3;
}

message OcrScreenRequest {
  optional Rect region = 1;
  optional string language = 2;
  optional string image_path = 3;
  optional string window_id = 4;
  optional string window_title = 5;
  optional string app = 6;
  optional uint32 page_segmentation_mode = 7;
  optional uint32 engine_mode = 8;
  optional uint32 dpi = 9;
  optional float min_confidence = 10;
  optional string whitelist = 11;
  repeated string config = 12;
  optional float scale = 13;
  optional bool grayscale = 14;
  optional uint32 threshold = 15;
  optional bool invert = 16;
  optional float contrast = 17;
  optional bool deskew = 18;
}

message OcrResponse {
  string backend_name = 1;
  string text = 2;
  repeated OcrBlock blocks = 3;
  repeated string warnings = 4;
  repeated OcrBlock words = 5;
}

message OcrBlock {
  string text = 1;
  UiElement element = 2;
}

message CompareImagesRequest {
  bytes expected_image = 1;
  bytes actual_image = 2;
  optional Rect region = 3;
  optional uint32 per_channel_threshold = 4;
  optional float max_changed_ratio = 5;
  repeated Rect ignore_regions = 6;
  optional uint64 max_changed_pixels = 7;
  optional float max_mean_absolute_error = 8;
  optional uint32 max_channel_delta = 9;
  optional string size_policy = 10;
  optional string alpha = 11;
}

message VisualDiffResponse {
  Rect compared_region = 1;
  uint64 compared_pixels = 2;
  uint64 changed_pixels = 3;
  float changed_ratio = 4;
  float mean_absolute_error = 5;
  uint32 max_channel_delta = 6;
  optional Rect changed_bounds = 7;
  bool matches = 8;
}

message DetectUiStateRequest {
  repeated bytes images = 1;
  optional Rect region = 2;
  optional uint32 per_channel_threshold = 3;
  optional float stable_max_changed_ratio = 4;
  optional float loading_min_changed_ratio = 5;
  optional uint32 required_stable_transitions = 6;
}

enum UiStateKind {
  UI_STATE_KIND_UNSPECIFIED = 0;
  UI_STATE_KIND_STABLE = 1;
  UI_STATE_KIND_LOADING = 2;
  UI_STATE_KIND_CHANGING = 3;
}

message UiStateResponse {
  UiStateKind state = 1;
  uint64 compared_transitions = 2;
  uint64 stable_transitions = 3;
  uint64 loading_transitions = 4;
  uint64 trailing_stable_transitions = 5;
  VisualDiffResponse latest_diff = 6;
  float max_changed_ratio = 7;
  float mean_changed_ratio = 8;
  optional Rect changed_bounds = 9;
}

message DetectUiElementsRequest {
  bytes image = 1;
  optional Rect region = 2;
  optional uint32 edge_threshold = 3;
  optional uint32 min_width = 4;
  optional uint32 min_height = 5;
  optional uint32 min_component_pixels = 6;
  optional uint32 max_elements = 7;
  optional uint32 merge_distance = 8;
}

message DetectUiElementsResponse {
  string backend_name = 1;
  string backend_kind = 2;
  repeated string warnings = 3;
  repeated UiElement elements = 4;
}

enum DmaBufImportTarget {
  DMA_BUF_IMPORT_TARGET_UNSPECIFIED = 0;
  DMA_BUF_IMPORT_TARGET_COMPUTE = 1;
  DMA_BUF_IMPORT_TARGET_EGL = 2;
  DMA_BUF_IMPORT_TARGET_EGL_TEXTURE = 3;
}

message ProbeDmaBufRequest {
  DmaBufImportTarget import_target = 1;
}

message DmaBufProbeResponse {
  DmaBufImportTarget import_target = 1;
  string backend_name = 2;
  uint32 stream_node_id = 3;
  optional uint64 pipewire_serial = 4;
  uint32 width = 5;
  uint32 height = 6;
  string pixel_format = 7;
  uint32 fourcc = 8;
  uint32 planes = 9;
  string memory_layout = 10;
  string synchronization = 11;
  optional string egl_version = 12;
  optional bool egl_modifiers = 13;
  optional uint32 texture_id = 14;
}

message ListPluginsRequest {
  repeated string paths = 1;
}

message PluginListResponse {
  string sdk_version = 1;
  repeated Plugin plugins = 2;
  repeated PluginDiscoveryError errors = 3;
}

message Plugin {
  string id = 1;
  string name = 2;
  string version = 3;
  optional string description = 4;
  string root_dir = 5;
  string manifest_path = 6;
  repeated string capabilities = 7;
  optional string entrypoint_kind = 8;
  repeated string entrypoint_command = 9;
  repeated PluginTool tools = 10;
  map<string, string> metadata = 11;
}

message PluginTool {
  string name = 1;
  string description = 2;
  repeated string capabilities = 3;
  string input_schema_json = 4;
}

message PluginDiscoveryError {
  string path = 1;
  string message = 2;
}

message CallPluginToolRequest {
  string plugin_id = 1;
  string tool = 2;
  string arguments_json = 3;
  repeated string paths = 4;
  optional uint32 timeout_ms = 5;
  optional uint32 max_output_bytes = 6;
}

message PluginToolExecutionResponse {
  bool ok = 1;
  string plugin_id = 2;
  string tool = 3;
  int32 exit_code = 4;
  string stdout = 5;
  string stderr = 6;
  optional string result_json = 7;
  optional string error = 8;
}

message DesktopFocusRequest {
  string app = 1;
  optional bool use_gnome_overview = 2;
  optional bool launch_if_needed = 3;
  optional uint64 wait_after_focus_ms = 4;
  optional uint64 overview_wait_ms = 5;
  optional string window_title = 6;
  optional string window_id = 7;
  bool verify = 8;
}

message DesktopLocateRequest {
  string app = 1;
  string target = 2;
  optional string image_path = 3;
  optional bool prefer_accessibility = 4;
  optional string window_title = 5;
  optional string window_id = 6;
}

message DesktopClickRequest {
  string app = 1;
  string target = 2;
  optional string image_path = 3;
  optional bool prefer_accessibility = 4;
  optional string window_title = 5;
  optional MouseButton button = 6;
  bool dry_run = 7;
  optional string window_id = 8;
  bool verify = 9;
}

message DesktopDragRequest {
  string app = 1;
  string target = 2;
  optional string image_path = 3;
  optional bool prefer_accessibility = 4;
  optional string window_title = 5;
  optional MouseButton button = 6;
  optional float from_ratio_x = 7;
  optional float from_ratio_y = 8;
  optional float to_ratio_x = 9;
  optional float to_ratio_y = 10;
  optional uint64 duration_ms = 11;
  bool dry_run = 12;
  optional string window_id = 13;
  bool verify = 14;
}

message DesktopTypeIntoRequest {
  string app = 1;
  string target = 2;
  string text = 3;
  optional string image_path = 4;
  optional bool prefer_accessibility = 5;
  optional string window_title = 6;
  bool clear = 7;
  bool dry_run = 8;
  optional string window_id = 9;
  bool verify = 10;
}

enum DesktopAssertionKind {
  DESKTOP_ASSERTION_KIND_UNSPECIFIED = 0;
  DESKTOP_ASSERTION_KIND_PRESENT = 1;
  DESKTOP_ASSERTION_KIND_NOT_PRESENT = 2;
  DESKTOP_ASSERTION_KIND_ACTIVE = 3;
  DESKTOP_ASSERTION_KIND_NOT_ACTIVE = 4;
  DESKTOP_ASSERTION_KIND_CONTAINS = 5;
  DESKTOP_ASSERTION_KIND_NOT_CONTAINS = 6;
}

message DesktopAssertRequest {
  string app = 1;
  string target = 2;
  optional string image_path = 3;
  optional bool prefer_accessibility = 4;
  optional string window_title = 5;
  DesktopAssertionKind assertion = 6;
  optional string expected_text = 7;
  optional string window_id = 8;
}

message DesktopActionResponse {
  string app = 1;
  string action = 2;
  string detail = 3;
  string backend_name = 4;
  bool verified = 5;
  optional string verification_detail = 6;
}

message DesktopLocateResponse {
  string app = 1;
  string target = 2;
  Point point = 3;
  optional Rect rect = 4;
  string source = 5;
}

message ActionResponse {
  bool ok = 1;
  string message = 2;
  optional string backend_name = 3;
  optional string backend_kind = 4;
}

message WindowInfo {
  string id = 1;
  string title = 2;
  optional string app_id = 3;
  Rect bounds = 4;
  bool focused = 5;
  string state = 6;
}

message UiElement {
  string id = 1;
  string role = 2;
  optional string label = 3;
  Rect bounds = 4;
  float confidence = 5;
  repeated string states = 6;
  optional Point center = 7;
  optional string window_id = 8;
  optional string window_title = 9;
  optional string app_id = 10;
  optional string parent_id = 11;
  repeated string child_ids = 12;
}

message Rect {
  int32 x = 1;
  int32 y = 2;
  uint32 width = 3;
  uint32 height = 4;
}

message Point {
  int32 x = 1;
  int32 y = 2;
}
